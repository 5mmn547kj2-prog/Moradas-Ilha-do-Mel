<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CT Assault</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050607;touch-action:none;font-family:"Segoe UI",Tahoma,Verdana,sans-serif;color:#e8c84a}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.t{position:absolute;font-size:14px;font-weight:700;text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.8);letter-spacing:.3px;line-height:1.45}
#tl{left:118px;top:12px;color:#c9c9c9}
#tr{right:14px;top:12px;text-align:right;color:#e8c84a}
#hp{left:14px;bottom:12px;font-size:28px;color:#5fd36a;display:none;font-variant-numeric:tabular-nums}
#hp.low{color:#ff5a4a}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#cross i{position:absolute;background:#7dff7d;box-shadow:0 0 4px rgba(0,0,0,.9)}
#cross .v{left:12px;top:0;width:2px;height:26px}
#cross .h{top:12px;left:0;height:2px;width:26px}
#cross .dot{left:11px;top:11px;width:4px;height:4px;border-radius:50%}
#cross.hit i{background:#ff4040}
#dmg{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(160,0,0,.75));opacity:0;transition:opacity .25s;pointer-events:none}
#jb,#jk{position:fixed;border-radius:50%;display:none;pointer-events:none}
#jb{width:120px;height:120px;border:2px solid rgba(255,255,255,.35);margin:-60px 0 0 -60px}
#jk{width:48px;height:48px;background:rgba(255,255,255,.4);margin:-24px 0 0 -24px;box-shadow:0 0 12px rgba(0,0,0,.4)}
.b{position:fixed;border-radius:50%;background:rgba(8,10,12,.55);border:2px solid rgba(232,200,74,.65);color:#e8c84a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.5px;pointer-events:auto;backdrop-filter:blur(6px);text-transform:uppercase}
#fire{right:calc(22px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:100px;height:100px;font-size:14px;background:rgba(180,30,20,.55);border-color:rgba(255,120,90,.8)}
#jump{right:calc(138px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px}
#rel{right:calc(36px + env(safe-area-inset-right));bottom:calc(142px + env(safe-area-inset-bottom));width:54px;height:54px}
#swap{right:calc(108px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom));width:54px;height:54px}
#scope{right:calc(178px + env(safe-area-inset-right));bottom:calc(102px + env(safe-area-inset-bottom));width:48px;height:48px;display:none}
#ov{position:fixed;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.92),rgba(12,18,14,.9));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0 0 8px;font-size:34px;letter-spacing:3px;color:#e8c84a;text-shadow:0 0 24px rgba(232,200,74,.35)}
#ov p{margin:6px 0 22px;max-width:460px;font-size:14px;line-height:1.6;color:#b8b8b8}
#go{padding:14px 40px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#f0d060,#c9a020);color:#111;border:0;border-radius:4px;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#go:active{transform:scale(.97)}
#rad{position:absolute;left:12px;top:12px;width:96px;height:96px;border-radius:50%;border:2px solid rgba(232,200,74,.45);box-shadow:0 0 16px rgba(0,0,0,.55),inset 0 0 20px rgba(0,0,0,.4)}
#feed{position:absolute;right:14px;top:58px;text-align:right;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
#feed div{margin:3px 0;color:#eee;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
#ban{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:26px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .5s;color:#fff}
#sc{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 34vh,#000 34.5vh)}
#sc:before,#sc:after{content:"";position:absolute;background:#000}
#sc:before{left:50%;top:0;bottom:0;width:2px}#sc:after{top:50%;left:0;right:0;height:2px}
#hitmk{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;opacity:0;pointer-events:none}
#hitmk:before,#hitmk:after{content:"";position:absolute;background:#ff3333;box-shadow:0 0 6px #f00}
#hitmk:before{left:18px;top:4px;width:4px;height:32px;transform:rotate(45deg)}
#hitmk:after{left:4px;top:18px;width:32px;height:4px;transform:rotate(45deg)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dmg"></div>
<div id="hitmk"></div>
<div id="hud">
  <div id="sc"></div>
  <canvas id="rad" width="96" height="96"></canvas>
  <div id="feed"></div>
  <div id="ban"></div>
  <div id="cross"><i class="v"></i><i class="h"></i><i class="dot"></i></div>
  <div class="t" id="tl"></div>
  <div class="t" id="tr"></div>
  <div class="t" id="hp"></div>
</div>
<div id="jb"></div><div id="jk"></div>
<div class="b" id="fire" data-a="fire">Fire</div>
<div class="b" id="jump" data-a="jump">Jump</div>
<div class="b" id="rel" data-a="reload">Rld</div>
<div class="b" id="swap" data-a="swap">Swap</div>
<div class="b" id="scope" data-a="scope">Zoom</div>
<div id="ov">
  <h1 id="ovt">CT ASSAULT</h1>
  <p id="ovp">Counter-Terrorist ops. Defend the hostages from Terrorists.<br>
  Move on the left · Look on the right · Landscape recommended.<br>
  Clear every wave. Lose two hostages — or die — and the mission fails.</p>
  <button id="go">Engage</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
